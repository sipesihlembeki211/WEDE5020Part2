    <main>
       <h1>Enquiries</h1>
        <p>Please fill out the form below and we will get back to you as soon as possible.</p>
         <form action="submit_enquiry.php" method="post">
         <label for="fullname">Name:</label><br>
         <input type="text" id="fullname" name="name" required><br><br>

         <label for="email">Email:</label><br>
         <input type="email" id="email" name="email" required><br><br>

         <label for="phone">Phone number:</label><br>
         <input type="tel" id="phone" name="phone" required><br><br>

         <label for="level">Student Level:</label><br>
        <select id="level" name="level" required>
            <option value="">Select a level</option>
            <option value="secondary">Secondary</option>
            <option value="tertiary">Tertiary</option>
        </select><br><br>
         <label for="subject">Subject :</label><br>
        <select id="subject" name="subject" required>
            <option value="">Select a subject</option>
            <option value="mathematics">Mathematics</option>
            <option value="physical_sciences">Physical Sciences</option>
            <option value="accounting">Accounting</option>
            <option value="life_sciences">Life Sciences</option>
            <option value="economics">Economics</option>
            <option value="statistics">Statistics</option>
            <option value="computer_science">Computer Science</option>
            <option value="engineering">Engineering</option>
        </select><br><br>
         <label>Preferred Learning method</label><br>
         <input type="radio" id="online" name="learning_method" value="online" required>
         <label for="online">Online</label>
         <br>
         <input type="radio" id="in_person" name="learning_method" value="in_person" required>
         <label for="in_person">In Person</label>
         <br><br>

         <label for="date">Preferred Start Date:</label><br>
         <input type="date" id="date" name="start_date" required><br><br>
         <label >Preferred days</label><br>
         <input type="checkbox" id="monday" name="preferred_days[]" value="monday">
         <label for="monday">Monday</label><br>
         <input type="checkbox" id="tuesday" name="preferred_days[]" value="tuesday">
         <label for="tuesday">Tuesday</label><br>    
         <input type="checkbox" id="wednesday" name="preferred_days[]" value="wednesday">
         <label for="wednesday">Wednesday</label><br>
         <input type="checkbox" id="thursday" name="preferred_days[]" value="thursday">
         <label for="thursday">Thursday</label><br>
         <input type="checkbox" id="friday" name="preferred_days[]" value="friday">
         <label for="friday">Friday</label><br>
         <input type="checkbox" id="saturday" name="preferred_days[]" value="saturday">
         <label for="saturday">Saturday</label><br><br>
        
         <label for="time">Preferred Time:</label><br>
         <input type="time" id="time" name="preferred_time" required><br><br>

         <label for="message">Your Enquiry:</label><br>
         <textarea id="message" name="message" rows="4" cols="50" placeholder="Please Tell  us what you need help with..."></textarea><br><br>

         <input type="checkbox" id="consent" name="consent"required>
         <label for="consent">I confirm that the information provided is accurate and I consent to being contacted by Sipesihle Tutoring Academy regarding my enquiry.</label><br><br>

         <input type="submit" value="Submit Enquiry">
         <input type="reset" value="Clear Form">
        </form>
    </main>
</body>
